          content:
            value: "<p>Heimdallr is a set of utilities and a web application which is actively being written to create administrative bridges between physical/virtual systems, utilities and services to bring them all together, and to help reduce the need to do what is commonly referred to as \"swivel-chair\" administration. The name comes from the Old Norse name for the mythical son of Odin, <a href=\"https://en.wikipedia.org/wiki/Heimdall\" target=\"_blank\">Heimdallr</a>, who keeps watch for invaders and who guards the burning rainbow bridge, Bifröst, due to my long fascination for Norse mythology, in part due to the subject in school, and in part due to the Marvel comics I occasionally read as a kid. But it reflects the knowledge and thinking of the author after numerous years of being responsible for multiple UN*X operating systems at past employers, as well as working on a provisioning service at one particular past employer to provision telephony and IP networking gear with things such as phone lines and DSL or GPON connections, combined with a knowledge of things including <a href=\"https://en.wikipedia.org/wiki/Cobbler_(software)\" target=\"_blank\">Cobbler</a> (and Koan), <a href=\"https://en.wikipedia.org/wiki/Ansible_(software)\" target=\"_blank\">Ansible</a>, <a href=\"https://en.wikipedia.org/wiki/OPNsense\" target=\"_blank\">OPNsense</a>, <a href=\"\" target=\"_blank\">phpIPAM</a>, <a href=\"https://en.wikipedia.org/wiki/Rsyslog\" target=\"_blank\">rsyslog</a>, and <a href=\"https://en.wikipedia.org/wiki/TrueNAS\" target=\"_blank\">TrueNAS</a>. I. It was originally written using Python and Django, but was switched to PHP and Laravel and Laravel Breeze, when it was easier to integrate DataTables at that time. However, it is currently being decided whether it will return to using Python/Django using knowledge gained while working on my Job Application Tracker application, or get a major revamp using Laravel 13 using Laravel Fortify directly. Either way, the result will have full roll based access control fully implemented, and will likely be using <a href=\"https://en.wikipedia.org/wiki/Htmx\" target=\"_blank\">htmx</a>.</p>\r\n\r\n<p>You can read my various blog posts on the subject <a href=\"/taxonomy/term/7\" target=\"_blank\">here</a> or see more at these locations:</p>\r\n<ul>\r\n    <li>\r\n        The GitHub <a href=\"https://github.com/cinnion/heimdallr\" target=\"_blank\">repository</a>.\r\n    </li>\r\n    <li>\r\n        My further description of it on my <a href=\"https://www.ka8zrt.com/demos#heimdallr\">demo page</a>.\r\n    </li>\r\n    <li>\r\n        The actual <a href=\"https://heimdallr.ka8zrt.com/\" target=\"_blank\">demo site</a>, which runs a slightly dated and crippled version of the software (the data used is currently a clone of the data used by the live site, with data such as the firewall logs time-lagged by 30 days), and actual host names \"obscured\" by being replaced by names like \"host5\".\r\n    </li>\r\n</ul>\r\n\r\nIn addition, I will be adding additional documentation pages, which will be listed below.\r\n\r\n\r\n\r\n"
            format: basic_html
          tokenize: false
