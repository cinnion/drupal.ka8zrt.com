          empty: true
          content:
            value: "<p><a href=\"https://www.ansible.com\" target=\"_blank\">Ansible</a> is a software tool suite which allows for automating tasks such as provisioning, configuration management and application deployment using an Infrastructure as Code (IaC) approach. Originally written by Michael DeHaan in 2012, and acquired by Red Hat in 2015, it works with both Unix-like systems and Microsoft Windows in an agentless fashion using temporary connections via SSH or Window Remote Management. It comes with a large ecosystem of installable modules, and uses a declarative language to create those modules, the playbooks which use them, and the configuration files it uses, primarily based on the <a href=\"https://yaml.org\" target=\"_blank\">YAML language</a></p>\r\n\r\n<p>As I note on <a href=\"/taxonomy/term/5\" target=\"_blank\">the page for my blog posts</a> pertaining to Ansible, it saves me so much time in the long run, applying the \"Don't repeat yourself\" or DRY principle of software development to system management. It allows me to write what Ansible refers to as \"roles\", which are a collection of tasks along with any files or templates and other information, and create what ansible calls \"playbooks\" which collect the roles together with non-role based tasks and the hosts to run the playbook against. As such, I often find myself either installing somebody else's role from the <a href=\"https://galaxy.ansible.com/ui/\" target=\"_blank\">Ansible Galaxy</a> repository, or writing my own role, throwing together a playbook, and using Ansible to do a task I might otherwise end up doing manually with a list of shell commands.</p>\r\n\r\n<p>You can read my blog posts on the topic using the link above, which also includes some links to some additional information, or by reading documentation pages I have written in addition to the README files included with each role, which will be listed below. But in general, the best source will always be those README files.</p>"
            format: basic_html
          tokenize: false
